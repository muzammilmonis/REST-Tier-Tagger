name: Build REST Tier Tagger - 1.20.1 to 26.3

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/**'
      - 'templates/**'
      - 'assets/**'
      - 'VERSION_MATRIX.json'
      - '.github/workflows/build-all.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { branch: '1.20.1', java: '17' }
          - { branch: '1.20.2', java: '17' }
          - { branch: '1.20.3', java: '17' }
          - { branch: '1.20.6', java: '21' }
          - { branch: '1.21', java: '21' }
          - { branch: '1.21.2', java: '21' }
          - { branch: '1.21.4', java: '21' }
          - { branch: '1.21.5', java: '21' }
          - { branch: '1.21.6', java: '21' }
          - { branch: '1.21.9', java: '21' }
          - { branch: '1.21.11', java: '21' }
          - { branch: '26.1', java: '25' }
          - { branch: '26.2', java: '25' }
          - { branch: '26.3', java: '25' }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build branch
        run: python3 tools/build_one.py '${{ matrix.branch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: rest-tier-tagger-${{ matrix.branch }}
          path: dist/${{ matrix.branch }}/*.jar
          if-no-files-found: error

  bundle:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rest-tier-tagger-*
          path: all-jars
          merge-multiple: true
      - name: Make combined ZIP
        run: zip -9 -r REST-Tier-Tagger-1.20.1-to-26.3.zip all-jars
      - uses: actions/upload-artifact@v4
        with:
          name: REST-Tier-Tagger-1.20.1-to-26.3
          path: REST-Tier-Tagger-1.20.1-to-26.3.zip
